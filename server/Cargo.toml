[package]
name = "votport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.97"
description = "Password-protected file receive portal built on VOT (Verified Object Transfer)"
publish = false

# Standalone build: never join a surrounding cargo workspace.
[workspace]

[dependencies]
vot-sdk = { git = "https://github.com/halideworks/VOT", rev = "b0c82d67415cf5fdbe1ca55e19aadf64cc5a5726" }
vot-sdk-file = { git = "https://github.com/halideworks/VOT", rev = "b0c82d67415cf5fdbe1ca55e19aadf64cc5a5726" }
vot-receipt = { git = "https://github.com/halideworks/VOT", rev = "b0c82d67415cf5fdbe1ca55e19aadf64cc5a5726" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rustix = { version = "1", features = ["process", "fs"] }
ed25519-dalek = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
