[package]
name = "votport"
version = "0.1.2"
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.97"
description = "Password-protected file receive portal built on VOT (Verified Object Transfer)"
publish = false

# Standalone build: never join a surrounding cargo workspace.
[workspace]

# VOT's live QUIC transport uses the same three quiche patches as its
# workspace. Cargo does not inherit a git dependency's workspace patch.
[patch.crates-io]
quiche = { git = "https://github.com/halideworks/quiche.git", rev = "2c9e98611ceafec3b8050b1d59ad738dab290d8f" }

[dependencies]
votport-client-core = { path = "../client/core" }
vot-sdk = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-verifier = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-sdk-file = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-receipt = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-cli = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448", default-features = false, features = ["wire"] }
vot-capability = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-manifest = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-platform-fs = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-scheduler = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }

axum = "0.8"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["server", "http1", "tokio", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicase = "2.9"
futures-util = "0.3"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
httpdate = "1"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
zip = { version = "2.4", default-features = false }
rustix = { version = "1", features = ["process", "fs"] }
ed25519-dalek = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "rustls-native-certs", "hostname"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
# Already a locked transitive dependency of openidconnect; the id-token
# verifier's `set_time_fn` needs `Utc::now()` directly.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs", "pem"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "fs"] }
age = "0.12"
tar = { version = "0.4", default-features = false }
x509-parser = "0.18"

[dev-dependencies]
vot-proof-blake3 = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-proof-sha256 = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-codec = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
async-trait = "0.1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"
vot-transport-api = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
