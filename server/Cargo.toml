[package]
name = "votport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.97"
description = "Password-protected file receive portal built on VOT (Verified Object Transfer)"
publish = false

# Standalone build: never join a surrounding cargo workspace.
[workspace]

# VOT's live QUIC transport uses the same three quiche patches as its
# workspace. Cargo does not inherit a git dependency's workspace patch.
[patch.crates-io]
quiche = { git = "https://github.com/halideworks/quiche.git", rev = "ce7e5b71f3198125ab92a1626390bbe3a2c7faa0" }

[dependencies]
vot-sdk = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-sdk-file = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-receipt = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-cli = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9", default-features = false, features = ["wire"] }
vot-capability = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-manifest = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-platform-fs = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-proof-blake3 = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-proof-sha256 = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }
vot-scheduler = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.11"
hex = "0.4"
zip = { version = "2.4", default-features = false }
rustix = { version = "1", features = ["process", "fs"] }
ed25519-dalek = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs", "pem"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"
vot-transport-api = { git = "https://github.com/halideworks/VOT", rev = "b14cc41debc2547c5ef999fee26bb055995284d9" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
