<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>VOTPort · Receive</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="masthead">
        <div class="hero-brand">
          <div class="brand-square"><img src="/assets/pommern_ship_white.png?v=70fc77f19116a72e" alt="" /></div>
          <span class="wordmark">VOTPort</span>
        </div>
        <select id="tenant-switcher" aria-label="Tenant" hidden></select>
      </header>
      <div class="bar">
        <nav id="nav" class="nav"></nav>
        <button id="logout" class="ghost">Sign out</button>
      </div>

      <h1>Receive files</h1>
      <p id="receive-dir" class="mono muted"></p>

      <form id="create-form" class="card">
        <h2>New transfer request</h2>
        <div class="grid">
          <label>Reference
            <input id="create-label" placeholder="Files from Alex" required maxlength="200" />
          </label>
          <label>Destination folder <span class="muted">optional</span>
            <input id="create-dest" placeholder="clients/alex" />
          </label>
          <label>Access password <span class="muted">optional</span>
            <input id="create-password" type="text" autocomplete="off" placeholder="none" />
          </label>
          <label>Expires after <span class="muted">days, optional</span>
            <input id="create-expires" type="number" min="1" max="3650" placeholder="never" />
          </label>
          <label>Transfer limit <span class="muted">GiB, optional</span>
            <input id="create-max" type="number" min="1" max="10000" placeholder="server default" />
          </label>
        </div>
        <label><input id="create-notify-on-upload" name="notify_on_upload" type="checkbox" /> Notify when an upload completes</label>
        <button type="submit">Issue request</button>
        <p class="error" id="create-error" role="alert" hidden></p>
      </form>

      <div id="new-link" class="card ok" hidden>
        <h2>Request issued</h2>
        <p class="mono" id="new-link-url"></p>
        <button id="new-link-copy" type="button">Copy address</button>
        <span id="new-link-note" class="muted"></span>
      </div>

      <h2>Issued requests</h2>
      <form id="links-filter" class="card">
        <div class="grid">
          <label>Search requests
            <input id="links-query" type="search" autocomplete="off" placeholder="reference or destination" />
          </label>
          <label>Status
            <select id="links-status">
              <option value="">All</option>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </label>
        </div>
        <button type="submit">Filter</button>
        <button type="button" id="links-refresh" class="ghost">Refresh</button>
      </form>
      <div id="links"></div>
      <button id="links-load-more" type="button" class="ghost" hidden>Load more</button>
      <p id="links-error" class="error" role="alert" hidden></p>
    <div id="outbound-result" class="card ok" hidden aria-live="polite">
      <h2>Download link issued</h2>
      <label>One-time address
        <input id="outbound-url" class="mono" type="text" readonly aria-describedby="outbound-note" />
      </label>
      <button id="outbound-copy" type="button">Copy address</button>
      <p id="outbound-note" class="muted">Shown once. Copy it now; this URL cannot be retrieved later.</p>
    </div>
      <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
    </div>

    <dialog id="confirm" class="modal">
      <form method="dialog">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-detail"></p>
        <div class="modal-actions">
          <button value="cancel" class="ghost" id="confirm-cancel">Cancel</button>
          <button value="ok" class="danger" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/assets/admin-common.js"></script>
    <script type="module" src="/assets/page-receive.js"></script>
  </body>
</html>
