<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>VOTPort &middot; Audit</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
    
  </head>
  <body class="admin" data-page="audit">
    <header class="topbar">
      <a class="brand" href="/links">
        <img src="/assets/pommern_ship_white.png" alt="" />
        <span>VOTPort</span>
      </a>
      <nav id="nav" class="nav"></nav>
      <span class="spacer"></span>
      <select id="tenant-switcher" hidden></select>
      <button id="logout" class="ghost">Sign out</button>
    </header>
    <main class="admin-main">
<div class="page-head">
        <h1>Audit log</h1>
        <div class="bar">
          <button id="refresh" class="ghost">Refresh</button>
          <a
            id="export"
            class="ghost button-link"
            href="/api/admin/audit?limit=10000"
            >Export JSONL</a
          >
          <span id="audit-range" class="mono muted"></span>
        </div>
      </div>

      <div id="audit-log" class="mono"></div>
    </main>
    <dialog id="confirm" class="modal">
      <form method="dialog">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-detail"></p>
        <div class="modal-actions">
          <button value="cancel" class="ghost" id="confirm-cancel">Cancel</button>
          <button value="ok" class="danger" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/assets/admin-common.js"></script>
    <script type="module" src="/assets/page-audit.js"></script>
  </body>
</html>
