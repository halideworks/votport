<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>VOTPort &middot; Audit</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/theme.js"></script>
    <!-- The whole module graph fetches at once instead of one import level per round trip. -->
    <link rel="modulepreload" href="/assets/page-audit.js" />
    <link rel="modulepreload" href="/assets/admin-common.js" />
    <link rel="modulepreload" href="/assets/object-card.js" />
    <link rel="modulepreload" href="/assets/undo.js" />
  </head>
  <body>
    <div class="sheet">
      <header class="masthead">
        <div class="hero-brand">
          <div class="brand-square">
            <img src="/assets/pommern_ship_white.png?v=70fc77f19116a72e" alt="" />
          </div>
          <span class="wordmark">VOTPort</span>
          <div class="brand-actions">
            <button id="theme-toggle" class="link theme-toggle" aria-label="Switch theme"></button>
            <button id="logout" class="ghost tiny">Sign out</button>
          </div>
        </div>
        <select id="tenant-switcher" aria-label="Tenant" hidden></select>
      </header>

      <div class="bar">
        <nav id="nav" class="nav"></nav>
        <form id="global-search" class="global-search" role="search" autocomplete="off">
          <input id="global-search-input" type="search" placeholder="Search requests, downloads, files, audit" aria-label="Search" maxlength="200" />
          <div id="global-search-results" class="search-results" hidden></div>
        </form>
      </div>

      <h1>Audit log</h1>

      <form id="audit-filters" class="card">
        <div class="grid">
          <label>Search
            <input id="audit-query" type="search" maxlength="100" autocomplete="off" placeholder="tenant, actor, event, or subject" />
          </label>
          <label>Event
            <input id="audit-event" maxlength="100" autocomplete="off" list="audit-event-options" placeholder="exact event" />
            <datalist id="audit-event-options"></datalist>
          </label>
          <label>Order
            <select id="audit-order">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </label>
        </div>
        <button type="submit">Apply</button>
        <button type="button" id="audit-clear" class="ghost">Clear</button>
      </form>
      <div class="bar">
        <button id="refresh" class="ghost">Refresh</button>
        <button id="load-more" class="ghost" hidden>Load more</button>
        <a id="export" class="ghost" href="/api/admin/audit?limit=10000">Export JSONL</a>
      </div>
      <p id="audit-range" class="mono muted"></p>
      <div id="audit-log" class="mono"></div>
      <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
    </div>

    <dialog id="confirm" class="modal">
      <form method="dialog">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-detail"></p>
        <div class="modal-actions">
          <button value="cancel" class="ghost" id="confirm-cancel">Cancel</button>
          <button value="ok" class="danger" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/assets/admin-common.js"></script>
    <script type="module" src="/assets/page-audit.js"></script>
  </body>
</html>
