<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>VOTPort &middot; Audit</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body data-page="audit">
    <div class="sheet wide">
      <header class="masthead">
        <div class="hero-brand">
          <div class="brand-square">
            <img src="/assets/pommern_ship_white.png" alt="" />
          </div>
          <span class="wordmark">VOTPort</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <select id="tenant-switcher" hidden></select>
        <button id="logout" class="ghost">Sign out</button>
      </header>

      <div class="bar">
        <button id="refresh" class="ghost">Refresh</button>
        <a id="export" class="ghost button-link" href="/api/admin/audit?limit=10000"
          >Export JSONL</a
        >
        <span id="audit-range" class="mono muted"></span>
      </div>

      <div id="audit-log" class="mono"></div>

      <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
    </div>

    <script type="module" src="/assets/page-audit.js"></script>
  </body>
</html>
