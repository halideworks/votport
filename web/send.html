<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VOTPort &middot; Download</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="hero">
  <div class="hero-brand">
    <div class="brand-square"><img src="/assets/pommern_ship_white.png" alt=""></div>
    <span class="wordmark">VOTPort</span>
  </div>
</div>

<div class="sheet">
  <header class="masthead">
    <h1 id="title">Verified download</h1>
    <p class="sub" id="status" aria-live="polite">Loading download&hellip;</p>
  </header>

  <section id="download-error" class="card" hidden aria-live="polite" role="alert">
    <h2>Download unavailable</h2>
    <p id="download-error-message"></p>
  </section>

  <section id="download-content" hidden aria-live="polite">
    <div class="card ok">
      <h2>Expected object identity</h2>
      <ul id="object" class="files"></ul>
      <p id="expires" class="muted"></p>
    </div>

    <div class="outbound-actions">
      <button id="download-file" type="button">Download file</button>
      <button id="download-receipt" type="button" class="ghost">Download receipt</button>
      <a href="/verify">Verify this receipt</a>
    </div>

    <details class="key-box" open>
      <summary>Receipt issuer</summary>
      <p class="muted">The receipt is signed by this server's key.</p>
      <p class="mono" id="receipt-key"></p>
    </details>
  </section>

  <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
</div>

<script type="module" src="/assets/outbound.js"></script>
</body>
</html>
