<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>VOTPort</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-brand">
        <div class="brand-square">
          <img src="/assets/pommern_ship_white.png" alt="" />
        </div>
        <span class="wordmark">VOTPort</span>
      </div>
    </div>

    <div class="sheet">
      <header class="masthead">
        <h1>Check a receipt</h1>
        <p class="sub">
          Drop a received file and its .vot-receipt to confirm what arrived.
        </p>
      </header>

      <section>
        <form id="verify-form">
          <div id="verify-drop" class="drop" tabindex="0">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"
              />
              <path d="M12 12v9" />
              <path d="m16 16-4-4-4 4" />
            </svg>
            <p>
              <strong
                >Drop the file and its .vot-receipt here, or browse:</strong
              >
              <button type="button" id="pick-payload" class="ghost">
                file
              </button>
              <button type="button" id="pick-sidecar" class="ghost">
                receipt
              </button>
            </p>
            <input type="file" id="payload-input" hidden />
            <input
              type="file"
              id="sidecar-input"
              accept=".vot-receipt,application/octet-stream"
              hidden
            />
          </div>

          <p class="muted" id="picked-note" hidden></p>
          <p class="muted" id="ignore-note" hidden></p>

          <button type="submit" id="check" disabled>Check</button>
          <p class="error" id="verify-error" hidden></p>
        </form>

        <div id="verify-result" class="card" hidden>
          <h2>Receipt checked</h2>
          <ul id="verify-list" class="files"></ul>
          <p class="muted" id="verify-next" hidden></p>
        </div>

        <p class="muted">
          This server's receipt key:
          <span class="mono" id="receipt-key">&hellip;</span>
        </p>
      </section>

      <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
    </div>

    <script type="module" src="/assets/verify.js"></script>
  </body>
</html>
