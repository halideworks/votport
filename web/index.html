<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>VOTPort &middot; Sign in</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-brand">
        <div class="brand-square">
          <img src="/assets/pommern_ship_white.png" alt="" />
        </div>
        <span class="wordmark">VOTPort</span>
      </div>
      <p class="hero-tag">Administration</p>
    </div>

    <div class="sheet">
      <section id="login">
        <header class="masthead">
          <h1>Sign in</h1>
          <p class="sub">Issue and manage transfer requests.</p>
        </header>
        <details id="login-password-details" open>
          <summary>Use local password</summary>
          <form id="login-form">
            <label
              >Administrator password
              <input
                type="password"
                id="login-password"
                autocomplete="current-password"
                required
              />
            </label>
            <button type="submit">Sign in</button>
          </form>
        </details>
        <button id="login-sso" type="button" hidden>Sign in with SSO</button>
        <p class="error" id="login-error" hidden></p>
      </section>

      <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
    </div>

    <!-- Already-signed-in visitors skip the form entirely; login.js
         handles that check plus SSO availability. -->
    <script type="module" src="/assets/login.js"></script>
  </body>
</html>
