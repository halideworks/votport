<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>VOTPort &middot; Tenants</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="masthead">
        <div class="hero-brand">
          <div class="brand-square">
            <img src="/assets/pommern_ship_white.png" alt="" />
          </div>
          <span class="wordmark">VOTPort</span>
        </div>
        <select id="tenant-switcher" aria-label="Tenant" hidden></select>
      </header>

      <div class="bar">
        <nav id="nav" class="nav"></nav>
        <button id="logout" class="ghost">Sign out</button>
      </div>

      <h1>Tenant namespaces</h1>

      <form id="tenant-form" class="card">
        <h2>New tenant</h2>
        <div class="grid">
          <label
            >Key
            <input id="tenant-key" placeholder="acme" required maxlength="128" />
          </label>
          <label
            >Label
            <input id="tenant-label" placeholder="Acme Corp" maxlength="200" />
          </label>
          <label
            >Admin group <span class="muted">SSO group, optional</span>
            <input id="tenant-admin-group" placeholder="acme-admins" />
          </label>
          <label
            >Storage quota <span class="muted">GiB, optional</span>
            <input id="tenant-max-total" type="number" min="1" placeholder="none" />
          </label>
          <label
            >Link limit <span class="muted">optional</span>
            <input id="tenant-max-links" type="number" min="1" placeholder="none" />
          </label>
          <label
            >Concurrent uploads <span class="muted">optional</span>
            <input id="tenant-max-sessions" type="number" min="1" placeholder="none" />
          </label>
        </div>
        <button type="submit">Create tenant</button>
        <p class="error" id="tenant-error" role="alert" hidden></p>
      </form>

      <h2>Namespaces</h2>
      <div id="tenants"></div>

      <h2>Principals</h2>
      <p class="muted">
        SSO users who have signed in. Revoke kicks current sessions and refuses
        SSO until unblocked. Lasting revoke is IdP group removal.
      </p>
      <label
        >Search principals
        <input id="principal-search" type="search" maxlength="100" placeholder="Subject" />
      </label>
      <p id="principal-count" class="muted" aria-live="polite"></p>
      <div id="principals"></div>
      <button id="principal-load-more" type="button" hidden>Load more</button>
      <p class="sheet-foot">Powered by Verified Object Transport (VOT)</p>
    </div>

    <dialog id="confirm" class="modal">
      <form method="dialog">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-detail"></p>
        <div class="modal-actions">
          <button value="cancel" class="ghost" id="confirm-cancel">Cancel</button>
          <button value="ok" class="danger" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/assets/admin-common.js"></script>
    <script type="module" src="/assets/page-tenants.js"></script>
  </body>
</html>
