name: ci

on:
  # A squash merge lands the tree the pull request already ran, so a push to
  # main only re-runs when it changes what the caches key on.
  push:
    branches: [main]
    paths:
      - server/Cargo.toml
      - server/Cargo.lock
      - client/Cargo.toml
      - client/Cargo.lock
      - package-lock.json
      - Dockerfile
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy && rustup default 1.97

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: |
          cargo test --locked
          cargo test --locked --lib -- --ignored --exact session::push_tests::dormant_staging_preserves_ranges_and_cleans_up_under_low_descriptor_limit

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy && rustup default 1.97

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/target
            server/target
          key: cargo-client-${{ runner.os }}-${{ hashFiles('client/Cargo.lock', 'server/Cargo.lock') }}

      - name: Format
        working-directory: client
        run: cargo fmt --check

      - name: Clippy
        working-directory: client
        run: cargo clippy --locked --all-targets -- -D warnings

      # The HTTP end-to-end test drives a real server. A debug build is enough
      # and skips the release profile's slow codegen; the wire feature it
      # carries still builds BoringSSL, cached across runs.
      - name: Build the server for the end-to-end test
        working-directory: server
        run: cargo build --locked

      - name: Tests
        working-directory: client
        run: VOTPORT_BIN="$GITHUB_WORKSPACE/server/target/debug/votport" cargo test --locked

      # The shells build only on their own machines, so the FFI surface is
      # checked here: the bindgen reads the built library and fails on a
      # surface the Swift generator cannot express.
      - name: Generate the Swift bindings
        working-directory: client
        run: |
          cargo build --locked -p votport-client-core
          cargo run --locked -p uniffi-bindgen -- generate --library target/debug/libvotport_client_core.so --language swift --out-dir target/bindings

  client-windows:
    # The client carries a QUIC push carrier, so it builds BoringSSL through
    # bindgen and nasm. This job proves it compiles and its tests build on
    # Windows; push receive is Unix-only, so Rust tests are built, not run.
    # The headless activation checks run here, followed by both shell builds.
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        run: rustup toolchain install 1.97 --profile minimal --component clippy && rustup default 1.97

      - name: Install nasm
        run: choco install nasm --no-progress -y

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/target
          key: cargo-client-windows-${{ hashFiles('client/Cargo.lock') }}

      - name: Clippy and build the tests
        working-directory: client
        shell: bash
        # LLVM ships on the runner; bindgen needs libclang and BoringSSL needs
        # nasm on PATH.
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          export PATH="$PATH:/c/Program Files/NASM"
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-run

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Check Windows activation
        shell: pwsh
        run: |
          dotnet run --project client/windows/ActivationTests/ActivationTests.csproj -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "activation checks failed" }
          dotnet run --project client/windows/NumericTests/NumericTests.csproj -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "numeric checks failed" }
          dotnet run --project client/windows/CrashLogTests/CrashLogTests.csproj -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "crash log checks failed" }

      - name: Build the Windows shells
        working-directory: client/windows
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          $env:PATH = "C:\Program Files\NASM;" + $env:PATH
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --rev e10ce410eb3a10cc19c7928b93ea8d84e038c034 --locked
          if ($LASTEXITCODE -ne 0) { throw "C# bindgen install failed" }
          .\build-core.ps1 -BuildProfile dev
          dotnet build Votport\Votport.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None
          if ($LASTEXITCODE -ne 0) { throw "unpackaged shell build failed" }
          # dotnet run builds to its own output layout and runs from there:
          # an explicit build plus --no-build guesses the RID-qualified path,
          # which differs between the 8.x and 10.x SDKs.
          $retention = Start-Process dotnet -ArgumentList @('run', '--project', 'RetentionTests\RetentionTests.csproj', '-c', 'Release', '-p:WindowsPackageType=None', '-p:TreatWarningsAsErrors=true') -NoNewWindow -PassThru
          if (!$retention.WaitForExit(60000)) {
            $retention.Kill($true)
            $retention.WaitForExit()
            throw "transfer retention checks timed out"
          }
          if ($retention.ExitCode -ne 0) { throw "transfer retention checks failed" }
          dotnet build Votport\Votport.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE -ne 0) { throw "MSIX shell build failed" }

  web:
    runs-on: ubuntu-24.04
    # npm ci against a slow registry ran past five minutes twice on one day
    # with nothing in the lockfile changed; the cache below keeps a warm run
    # under a minute and the cap covers a cold one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Syntax-check browser JavaScript
        run: |
          for f in web/assets/*.js; do node --check "$f"; done

      - name: Install pinned JavaScript tooling
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Lint browser JavaScript
        run: npm run lint

      - name: Browser JavaScript unit tests
        run: npm test

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cargo advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: server/Cargo.toml
          command: check advisories licenses bans sources

      - name: Client Cargo advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: client/Cargo.toml
          command: check advisories licenses bans sources

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the image (compiles vot-wasm + server)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: votport:ci
          build-args: |
            VOTPORT_VERSION=ci
            VOTPORT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=votport-ci
          cache-to: type=gha,mode=max,scope=votport-ci,ignore-error=true

      - name: Verify the compiled build identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test "$(docker run --rm votport:ci /app/votport --version)" = "votport ci ($EXPECTED_REVISION)"
          test "$(docker image inspect votport:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_REVISION"

      - name: Run real S3 delivery and backup acceptance
        env:
          S3_TEST_ACCESS_KEY: votport-ci-access
          S3_TEST_SECRET_KEY: votport-ci-secret
        run: |
          set -Eeuo pipefail
          s3_root="$(mktemp -d)"
          e2e_root="$s3_root/e2e"
          s3_data="$s3_root/minio"
          mkdir -p "$e2e_root" "$s3_data"
          chmod 700 "$s3_root" "$e2e_root" "$s3_data"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs votport-s3-minio || true
              docker logs votport-s3-server || true
              cat "$e2e_root/server.log" || true
            fi
            docker rm -f votport-s3-server votport-s3-minio >/dev/null 2>&1 || true
            rm -rf "$s3_root"
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d --name votport-s3-minio \
            --user "$(id -u):$(id -g)" \
            -e MINIO_ROOT_USER="$S3_TEST_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_TEST_SECRET_KEY" \
            --mount "type=bind,src=$s3_data,dst=/data" \
            -p 127.0.0.1:19000:9000 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883 \
            server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:19000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "MinIO did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          cat > "$e2e_root/votport" <<'SH'
          #!/bin/sh
          set -eu
          exec docker run --rm --init --name votport-s3-server \
            --network host --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$VOTPORT_TEST_ROOT,dst=$VOTPORT_TEST_ROOT" \
            --mount "type=bind,src=$VOTPORT_WEB_ROOT,dst=/app/web,readonly" \
            -e VOTPORT_BIND -e VOTPORT_PUBLIC_URL -e VOTPORT_DATA_DIR \
            -e VOTPORT_RECEIVE_DIR -e VOTPORT_OUTBOUND_DIR \
            -e VOTPORT_WEB_ROOT=/app/web -e VOTPORT_ADMIN_PASSWORD \
            -e VOTPORT_SERVE_BIND -e VOTPORT_PUSH_BIND \
            -e VOTPORT_STORAGE_FIXTURE_ACCESS_KEY_ID \
            -e VOTPORT_STORAGE_FIXTURE_SECRET_ACCESS_KEY \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_ENDPOINT -e AWS_ENDPOINT_URL_S3 -e AWS_BUCKET \
            -e RUST_LOG votport:ci /app/votport "$@"
          SH
          chmod 700 "$e2e_root/votport"
          VOTPORT_TEST_ROOT="$e2e_root" \
            python3 scripts/delivery-storage-e2e.py \
              --server "$e2e_root/votport" \
              --root "$e2e_root" \
              --web-root "$GITHUB_WORKSPACE/web" \
              --s3 http://127.0.0.1:19000

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}

      - name: Install Chromium for browser acceptance
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          npm ci
          npx --no-install playwright install --with-deps chromium
          unzip -v >/dev/null

      - name: Run browser critical paths
        env:
          ADMIN_PASSWORD: votport-browser-e2e-password
          VOTPORT_SCIM_TOKEN: votport-browser-e2e-scim-token
          CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
        run: |
          set -Eeuo pipefail
          e2e_root="$(mktemp -d)"
          data_dir="$e2e_root/data"
          receive_dir="$e2e_root/receive"
          outbound_dir="$e2e_root/library"
          mkdir -p "$data_dir" "$receive_dir" "$outbound_dir" "$e2e_root/shared"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs votport-browser-e2e || true
              docker logs votport-browser-peer || true
            fi
            docker rm -f votport-browser-e2e votport-browser-peer >/dev/null 2>&1 || true
            docker network rm votport-browser-trade >/dev/null 2>&1 || true
            rm -rf "$e2e_root"
            exit "$status"
          }
          trap cleanup EXIT

          docker network create votport-browser-trade
          docker run -d --name votport-browser-e2e --network votport-browser-trade \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8080:8080 \
            --user "$(id -u):$(id -g)" \
            -e VOTPORT_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e VOTPORT_SCIM_TOKEN="$VOTPORT_SCIM_TOKEN" \
            -e VOTPORT_PUBLIC_URL=http://127.0.0.1:8080 \
            -e VOTPORT_DATA_DIR=/data \
            -e VOTPORT_RECEIVE_DIR=/received \
            -e VOTPORT_OUTBOUND_DIR=/outbound \
            -v "$data_dir:/data" \
            -v "$receive_dir:/received" \
            -v "$outbound_dir:/outbound" \
            -v "$e2e_root/shared:$e2e_root/shared" \
            votport:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "votport did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          BASE_URL=http://127.0.0.1:8080 \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            RECEIVE_DIR="$receive_dir" \
            npm run browser:e2e
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            WORKFLOW_TEST_ROOT="$e2e_root" node scripts/delivery-browser-e2e.mjs
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            WORKFLOW_TEST_ROOT="$e2e_root" node scripts/workspace-browser-e2e.mjs
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            VOTPORT_SCIM_TOKEN="$VOTPORT_SCIM_TOKEN" WORKFLOW_TEST_ROOT="$e2e_root" \
            node scripts/viewer-browser-e2e.mjs
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            WORKFLOW_TEST_ROOT="$e2e_root" node scripts/usability-browser-e2e.mjs
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            node scripts/main-landmark-browser-e2e.mjs
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            WORKFLOW_TEST_ROOT="$e2e_root" NOTIFY_TEST_HOST=host.docker.internal NOTIFY_TEST_BIND=0.0.0.0 node scripts/notification-routing-browser-e2e.mjs
          BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            WORKFLOW_TEST_ROOT="$e2e_root" node scripts/branding-browser-e2e.mjs
          mkdir -p "$e2e_root/peer-data" "$e2e_root/peer-receive" "$e2e_root/peer-library"
          chmod 700 "$e2e_root/peer-receive"
          docker run -d --name votport-browser-peer --network votport-browser-trade \
            --add-host=host.docker.internal:host-gateway -p 127.0.0.1:8081:8080 \
            --user "$(id -u):$(id -g)" -e VOTPORT_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e VOTPORT_PUBLIC_URL=http://127.0.0.1:8081 \
            -v "$e2e_root/peer-data:/data" -v "$e2e_root/peer-receive:/received" \
            -v "$e2e_root/peer-library:/outbound" votport:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:8081/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then docker logs votport-browser-peer; exit 1; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8080 TRADE_PEER_URL=http://127.0.0.1:8081 \
            TRADE_PEER_ADDRESS=http://votport-browser-peer:8080 ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            WORKFLOW_TEST_ROOT="$e2e_root" NOTIFY_TEST_HOST=host.docker.internal NOTIFY_TEST_BIND=0.0.0.0 \
            node scripts/trade-routes-browser-e2e.mjs

      - name: Run shared and replica restart drills
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          RESTART_TEST_ROOT="$(mktemp -d)"
          export RESTART_TEST_ROOT PORT=18080
          cleanup() {
            status=$?
            docker rm -f votport-restart-18080 votport-restart-18081 >/dev/null 2>&1 || true
            rm -rf "$RESTART_TEST_ROOT"
            exit "$status"
          }
          trap cleanup EXIT
          cat > "$RESTART_TEST_ROOT/votport" <<'SH'
          #!/bin/sh
          set -eu
          exec docker run --rm --init --name "votport-restart-${VOTPORT_BIND##*:}" \
            --network host --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RESTART_TEST_ROOT,dst=$RESTART_TEST_ROOT" \
            -e VOTPORT_BIND -e VOTPORT_PUBLIC_URL -e VOTPORT_DATA_DIR \
            -e VOTPORT_RECEIVE_DIR -e VOTPORT_OUTBOUND_DIR \
            -e VOTPORT_WEB_ROOT=/app/web -e VOTPORT_ADMIN_PASSWORD \
            -e VOTPORT_MAX_UPLOAD_BYTES -e VOTPORT_REPLICA_TOKEN \
            -e VOTPORT_STANDBY_SOURCE -e VOTPORT_STANDBY_INTERVAL_SECS \
            -e RUST_LOG votport:ci /app/votport "$@"
          SH
          chmod 700 "$RESTART_TEST_ROOT/votport"
          export VOTPORT_BIN="$RESTART_TEST_ROOT/votport" TMPDIR="$RESTART_TEST_ROOT"
          MODE=shared node scripts/restart-e2e.mjs
          MODE=replica node scripts/restart-e2e.mjs

      # The NAS write path tests only accept a receive directory whose
      # mountinfo filesystem is nfs, nfs4, cifs or smb3. The CIFS stack let a
      # second process acquire the writer lock, so the fixture now serves
      # NFSv4 only: nfs-ganesha in a privileged container (userland server,
      # no host nfsd module needed) exporting the tmpfs share on the static
      # NFSv4 port, and the kernel nfs4 client enforces the byte-range locks
      # server-side exactly as the writer lock assertions demand. The lock
      # revocation drills stay ignored: they need an external operator to
      # drop the client's locks.
      - name: Run NAS write path acceptance against a real NFSv4 share
        working-directory: server
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          nas_root="$(mktemp -d)"
          nas_mount="$(mktemp -d)"
          mkdir -p "$nas_root/source" "$nas_root/tmp"
          dd if=/dev/urandom of="$nas_root/source/campaign-a.bin" bs=1M count=2 status=none
          dd if=/dev/urandom of="$nas_root/source/campaign-b.bin" bs=1M count=2 status=none
          printf 'votport nas fixture\n' > "$nas_root/source/campaign-c.txt"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs votport-nas-ganesha || true
            fi
            sudo umount "$nas_mount" >/dev/null 2>&1 || true
            docker rm -f votport-nas-ganesha >/dev/null 2>&1 || true
            rm -rf "$nas_root" "$nas_mount"
            exit "$status"
          }
          trap cleanup EXIT

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nfs-common

          # Digest-pinned prebuilt ganesha image: no package installation at
          # run time (PR 395 showed apt-at-runtime pushed the server past the
          # 15 minute step budget). start_nfs.sh generates the export config
          # from env: EXPORT_PATH defaults to /data/nfs (the tmpfs volume),
          # PSEUDO_PATH=/votport serves the 127.0.0.1:/votport mount, and
          # NFSv4 minor versions 0-2 are enabled by default.
          docker run -d --name votport-nas-ganesha \
            --privileged \
            --tmpfs "/data/nfs:rw,size=268435456,uid=$(id -u),gid=$(id -g),mode=0770" \
            -p 127.0.0.1:2049:2049 \
            -e PSEUDO_PATH=/votport \
            -e EXPORT_ID=77 \
            -e PROTOCOLS=4 \
            -e TRANSPORTS=TCP \
            -e SEC_TYPE=sys \
            -e SQUASH_MODE=No_Root_Squash \
            -e GRACELESS=true \
            janeczku/nfs-ganesha:latest@sha256:17fe1813fd20d9fdfa497a26c8a2e39dd49748cd39dbb0559df7627d9bcf4c53

          # Readiness gate before any mount: ganesha logs this exact line once
          # it is serving. Never retry the mount itself; mount.nfs4 blocks
          # ~126s per attempt on a missing server.
          nas_ready=0
          for _ in $(seq 1 90); do
            if docker logs votport-nas-ganesha 2>&1 | grep -q "NFS SERVER INITIALIZED"; then
              nas_ready=1
              break
            fi
            sleep 1
          done
          if [ "$nas_ready" -ne 1 ]; then
            echo "the ganesha fixture never reported NFS SERVER INITIALIZED" >&2
            docker logs votport-nas-ganesha || true
            exit 1
          fi

          if ! timeout 30 sudo mount -t nfs4 -o vers=4.1 127.0.0.1:/votport "$nas_mount"; then
            echo "the nfs4 fixture mount failed" >&2
            docker logs votport-nas-ganesha || true
            exit 1
          fi
          grep -q ' - nfs4 ' /proc/self/mountinfo

