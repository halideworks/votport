name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy && rustup default 1.97

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax-check browser JavaScript
        run: |
          for f in web/assets/*.js; do node --check "$f"; done

      - name: Install pinned JavaScript tooling
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Lint browser JavaScript
        run: npm run lint

      - name: Browser JavaScript unit tests
        run: npm test

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cargo advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: server/Cargo.toml
          command: check advisories licenses bans sources

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the image (compiles vot-wasm + server)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: votport:ci
          cache-from: type=gha,scope=votport-ci
          cache-to: type=gha,mode=max,scope=votport-ci,ignore-error=true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for browser acceptance
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
          unzip -v >/dev/null

      - name: Run browser critical paths
        env:
          ADMIN_PASSWORD: votport-browser-e2e-password
        run: |
          set -Eeuo pipefail
          e2e_root="$(mktemp -d)"
          data_dir="$e2e_root/data"
          receive_dir="$e2e_root/receive"
          outbound_dir="$e2e_root/outbound"
          mkdir -p "$data_dir" "$receive_dir" "$outbound_dir"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs votport-browser-e2e || true
            fi
            docker rm -f votport-browser-e2e >/dev/null 2>&1 || true
            rm -rf "$e2e_root"
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d --name votport-browser-e2e \
            -p 127.0.0.1:8080:8080 \
            --user "$(id -u):$(id -g)" \
            -e VOTPORT_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e VOTPORT_PUBLIC_URL=http://127.0.0.1:8080 \
            -e VOTPORT_DATA_DIR=/data \
            -e VOTPORT_RECEIVE_DIR=/received \
            -e VOTPORT_OUTBOUND_DIR=/outbound \
            -v "$data_dir:/data" \
            -v "$receive_dir:/received" \
            -v "$outbound_dir:/outbound" \
            votport:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "votport did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          BASE_URL=http://127.0.0.1:8080 \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            RECEIVE_DIR="$receive_dir" \
            npm run browser:e2e
