name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify release version
        shell: bash
        run: |
          set -Eeuo pipefail
          # The MSIX and DMG stamp the client versions, so all three must match.
          for manifest in server/Cargo.toml client/core/Cargo.toml client/cli/Cargo.toml; do
            version="$(sed -n '/^\[package\]/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' "$manifest" | head -n 1)"
            if [[ "$RELEASE_TAG" != "v$version" ]]; then
              echo "tag $RELEASE_TAG does not match $manifest version $version" >&2
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # Attach an SBOM to the image index in GHCR (the action already adds
          # provenance for a public repository). The scanner is pinned like
          # every other image here; re-resolve the digest when bumping it.
          # `docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'` reads it.
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=votport-ci
          # Only the commit tag is pushed here; the release tag is added after
          # the vulnerability scan passes, so a failing image never carries it.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VOTPORT_VERSION=${{ env.RELEASE_TAG }}
            VOTPORT_REVISION=${{ github.sha }}

      # Scans the commit tag just pushed to GHCR; the image is not loaded into
      # the runner daemon, so trivy pulls it with the credentials the login
      # step stored. Fails the release on CRITICAL,HIGH, matching the CI posture
      # of npm audit --audit-level=high.
      - name: Scan the image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Tag the scanned image with the release
        run: docker buildx imagetools create --tag "${IMAGE}:${RELEASE_TAG}" "${IMAGE}@${{ steps.image.outputs.digest }}"

      - name: Record image digest
        run: |
          {
            echo "### Published image"
            echo "\`${IMAGE}@${{ steps.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" \
              --notes "Image: ${IMAGE}@${{ steps.image.outputs.digest }}"
          fi

  # The shells build only on their own platforms. macOS minutes bill at ten
  # times Linux and Windows at two, so both run on tags alone. Both artifacts
  # are unsigned until the Developer ID and the code-signing certificate
  # land: the steps that would sign are the ones marked below. Both need
  # the release job, which creates the release they upload to, so a failed
  # release never bills them.
  macos-app:
    needs: release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal && rustup default 1.97
          # The core builds a universal XCFramework: both Apple targets need
          # their rust-std, and the minimal profile ships the host's only.
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install cmake and xcodegen
        run: brew install cmake xcodegen

      - name: Build the core and the app
        working-directory: client/macos
        run: |
          sh build-core.sh
          xcodegen generate
          # The published app targets Apple silicon; the bundled CLI is universal.
          xcodebuild -project Votport.xcodeproj -scheme Votport -configuration Release \
            -derivedDataPath build ARCHS=arm64 CODE_SIGN_IDENTITY=- build

      - name: Verify the built app version
        working-directory: client/macos
        run: |
          set -eu
          app=build/Build/Products/Release/Votport.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${RELEASE_TAG#v}"
          test "$("$app/Contents/Resources/votport-cli" --version)" = "votport ${RELEASE_TAG#v}"

      # Developer ID signing and notarization go here once the identity is
      # in the repository secrets: codesign --deep --options runtime, then
      # notarytool submit --wait and stapler staple.
      - name: Make the disk image
        working-directory: client/macos
        run: |
          mkdir -p dist/Votport
          cp -R build/Build/Products/Release/Votport.app dist/Votport/
          ln -s /Applications dist/Votport/Applications
          hdiutil create -volname Votport -srcfolder dist/Votport -ov -format UDZO "dist/votport-${RELEASE_TAG}-macos-arm64.dmg"

      # No --clobber: a re-run must fail loudly instead of silently
      # replacing the artifact under the same name.
      - name: Upload the disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: client/macos
        run: |
          shasum -a 256 "dist/votport-${RELEASE_TAG}-macos-arm64.dmg" > "dist/votport-${RELEASE_TAG}-macos-arm64.dmg.sha256"
          gh release upload "$RELEASE_TAG" "dist/votport-${RELEASE_TAG}-macos-arm64.dmg" "dist/votport-${RELEASE_TAG}-macos-arm64.dmg.sha256"

  windows-app:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Rust 1.97
        run: rustup toolchain install 1.97 --profile minimal && rustup default 1.97

      - name: Install nasm and the C# bindgen
        run: |
          choco install nasm --no-progress -y
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --rev e10ce410eb3a10cc19c7928b93ea8d84e038c034 --locked

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Build the core and the package
        working-directory: client/windows
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          $env:PATH = "C:\Program Files\NASM;" + $env:PATH
          .\build-core.ps1
          # The runner image's 10.x SDK swallows the WinAppSDK restore error
          # (MSB4181 with no message); global.json pins 8.0 and this restore
          # surfaces any remaining failure with its actual text.
          dotnet --list-sdks
          dotnet restore Votport\Votport.csproj -p:Platform=x64 --verbosity normal
          dotnet build Votport\Votport.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true --no-restore
          $msix = Get-ChildItem -Recurse -Filter "Votport_*.msix" | Where-Object { $_.FullName -notmatch "Dependencies" } | Select-Object -First 1
          Copy-Item $msix.FullName "votport-$env:RELEASE_TAG-windows-x64.msix"

      # signtool with the code-signing certificate goes here once it is in
      # the repository secrets.
      # No --clobber: a re-run must fail loudly instead of silently
      # replacing the artifact under the same name.
      - name: Upload the package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: client/windows
        shell: bash
        run: |
          sha256sum "votport-${RELEASE_TAG}-windows-x64.msix" > "votport-${RELEASE_TAG}-windows-x64.msix.sha256"
          gh release upload "$RELEASE_TAG" "votport-${RELEASE_TAG}-windows-x64.msix" "votport-${RELEASE_TAG}-windows-x64.msix.sha256"
