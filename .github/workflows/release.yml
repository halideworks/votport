name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify release version
        shell: bash
        run: |
          set -Eeuo pipefail
          server_version="$(sed -n '/^\[package\]/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' server/Cargo.toml | head -n 1)"
          if [[ "$VERSION" != "v$server_version" ]]; then
            echo "tag $VERSION does not match server version $server_version" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=votport-ci
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VOTPORT_VERSION=${{ env.VERSION }}
            VOTPORT_REVISION=${{ github.sha }}

      - name: Record image digest
        run: |
          {
            echo "### Published image"
            echo "\`${IMAGE}@${{ steps.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" \
              --notes "Image: ${IMAGE}@${{ steps.image.outputs.digest }}"
          fi
