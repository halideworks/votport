services:
  votport:
    build:
      context: .
      args:
        VOTPORT_VERSION: "${VOTPORT_VERSION:-dev}"
        VOTPORT_REVISION: "${VOTPORT_REVISION:-unknown}"
    restart: unless-stopped
    # Allow streaming requests to finish during a normal stop.
    stop_grace_period: 5m
    # The bind roots must be writable by this container user.
    user: "1000:1000"
    ports:
      - "127.0.0.1:8103:8080"
    environment:
      VOTPORT_ADMIN_PASSWORD: "${VOTPORT_ADMIN_PASSWORD:?set VOTPORT_ADMIN_PASSWORD in .env}"
      VOTPORT_PUBLIC_URL: "${VOTPORT_PUBLIC_URL:?set VOTPORT_PUBLIC_URL in .env}"
      VOTPORT_SESSION_IDLE_SECS: "${VOTPORT_SESSION_IDLE_SECS:-172800}"
      # Require a bearer token on /metrics. Replace with a long random value
      # before deploying; scrape from the private upstream, since the public
      # Caddy examples answer 404 for /metrics and /readyz.
      VOTPORT_METRICS_TOKEN: "${VOTPORT_METRICS_TOKEN:?set VOTPORT_METRICS_TOKEN in .env}"
    volumes:
      - ./data:/data
      - ./received:/received
      - ./outbound:/outbound
