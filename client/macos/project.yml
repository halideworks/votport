# The macOS shell's Xcode project, generated by xcodegen (`xcodegen generate`
# in this directory) so the .xcodeproj is never committed. Run build-core.sh
# first: it builds the Rust core into VotportCore/ (the XCFramework and the
# generated Swift), which this project consumes as a local package.
name: Votport
options:
  bundleIdPrefix: com.halideworks
  deploymentTarget:
    macOS: "14.0"
packages:
  VotportCore:
    path: VotportCore
targets:
  Votport:
    type: application
    platform: macOS
    sources:
      - Votport
      - path: VotportCore/votport-cli
        buildPhase: resources
      - path: ../design/sounds/completion.wav
        buildPhase: resources
      # The OFL fonts, copied as a folder into Resources/fonts.
      - path: ../design/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: VotportCore
    info:
      path: Votport/Info.plist
      properties:
        CFBundleName: Votport
        CFBundleDisplayName: votport
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        ATSApplicationFontsPath: fonts
        # The web pages' "Open in the votport app" links.
        CFBundleURLTypes:
          - CFBundleURLName: com.halideworks.votport.link
            CFBundleURLSchemes: [votport]
            CFBundleTypeRole: Viewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halideworks.votport
        # Votport/Assets.xcassets, rendered by scripts/app-icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # Ad hoc until the Developer ID lands; the app runs locally unsigned.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
