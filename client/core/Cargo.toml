[package]
name = "votport-client-core"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.97"
description = "Cross-platform core for the votport desktop client"
publish = false

# The shells link the core as a static library (macOS XCFramework) or a
# shared one (Windows DLL); the CLI links the rlib.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vot-cli = { git = "https://github.com/halideworks/VOT", rev = "0a129ea8b7ef47578b956f3c70a8274bf623cb79", default-features = false, features = ["wire"] }
vot-object = { git = "https://github.com/halideworks/VOT", rev = "0a129ea8b7ef47578b956f3c70a8274bf623cb79" }
vot-manifest = { git = "https://github.com/halideworks/VOT", rev = "0a129ea8b7ef47578b956f3c70a8274bf623cb79" }

reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "2"
# Pinned to the release uniffi-bindgen-cs (the Windows shell's C# generator)
# targets; the Swift generator ships inside uniffi itself.
uniffi = "0.31.0"
tempfile = "3"
# Free space at a destination before a receive commits; already in the
# tree through vot-platform-fs.
fs4 = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "cookies", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
