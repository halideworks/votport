[package]
name = "votport-client-core"
version = "0.1.2"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.97"
description = "Cross-platform core for the votport desktop client"
publish = false

# The shells link the core as a static library (macOS XCFramework) or a
# shared one (Windows DLL); the CLI links the rlib.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vot-cli = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448", default-features = false, features = ["wire"] }
vot-object = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-manifest = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }
vot-platform-fs = { git = "https://github.com/halideworks/VOT", rev = "fff2b842aae2fd40f5fc2fc5e26c82cf8256d448" }

reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
percent-encoding = "2"
sha2 = "0.11"
base64 = "0.23"
ed25519-dalek = "2"
rand = "0.10"
thiserror = "2"
# Pinned to the release uniffi-bindgen-cs (the Windows shell's C# generator)
# targets; the Swift generator ships inside uniffi itself.
uniffi = "0.32.1"
tempfile = "3"
# Free space at a destination before a receive commits; already in the
# tree through vot-platform-fs.
fs4 = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "cookies", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
