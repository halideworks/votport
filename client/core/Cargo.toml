[package]
name = "votport-client-core"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.97"
description = "Cross-platform core for the votport desktop client"
publish = false

[dependencies]
# The HTTP send path needs no QUIC carrier, so vot-cli is taken without its
# wire feature: no quiche, no BoringSSL, no cmake. The push path (PR 2) turns
# the feature on and adds the quiche patch then.
vot-cli = { git = "https://github.com/halideworks/VOT", rev = "0a129ea8b7ef47578b956f3c70a8274bf623cb79", default-features = false }
vot-object = { git = "https://github.com/halideworks/VOT", rev = "0a129ea8b7ef47578b956f3c70a8274bf623cb79" }
vot-manifest = { git = "https://github.com/halideworks/VOT", rev = "0a129ea8b7ef47578b956f3c70a8274bf623cb79" }

reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "cookies", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
