# The desktop client's own cargo workspace, like server/. votport has no root
# manifest, so this is not swallowed by a parent. The wire feature and its
# quiche patch arrive with the push path in PR 2.
[workspace]
resolver = "2"
members = ["core", "cli", "uniffi-bindgen"]

# vot-cli's wire feature pulls VOT's live QUIC transport, which needs the same
# quiche fork VOT's workspace patches to. A git dependency's own patch is not
# inherited, so it is declared here at the workspace root.
[patch.crates-io]
quiche = { git = "https://github.com/halideworks/quiche.git", rev = "ce7e5b71f3198125ab92a1626390bbe3a2c7faa0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
