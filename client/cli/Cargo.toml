[package]
name = "votport-client"
version = "0.1.2"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.97"
description = "votport desktop client CLI"
publish = false

[[bin]]
name = "votport"
path = "src/main.rs"

[dependencies]
votport-client-core = { path = "../core" }
serde_json = "1"

# Terminal echo off for the sign-in password prompt; both are already in the
# lockfile through the core.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
