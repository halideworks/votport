# CI runs `deny check advisories licenses bans sources` (ci.yml).

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (rsa crate, Marvin timing sidechannel): no upstream patch.
# votport only VERIFIES id-token signatures with public keys via openidconnect;
# it never holds an RSA private key, which is what the attack recovers.
# Revisit when RustCrypto ships the constant-time implementation.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa used for public-key signature verification only" },
]

# Server and client inventory on 2026-09-07: third-party crates use the
# allowlist below or the package-scoped UniFFI exceptions. GPL-2.0-only (self_cell) and
# LGPL-2.1-or-later (r-efi) appear only as alternatives beside MIT or
# Apache-2.0 and are satisfied by those. The AGPL-3.0-only vot-* crates are
# publish = false and skipped here like votport itself; [sources] is what
# confines them to the halideworks repositories.
[licenses]
version = 2
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

exceptions = [
    { name = "uniffi", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_bindgen", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_core", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_internal_macros", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_macros", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_meta", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_pipeline", version = "=0.31.2", allow = ["MPL-2.0"] },
    { name = "uniffi_udl", version = "=0.31.2", allow = ["MPL-2.0"] },
]

# Duplicates stay informational (warn). The deny list below fails cargo-deny
# if a C-and-assembly crypto stack beyond the three known ones appears in
# either tree, or if rustls ships a version that could change its provider
# architecture. Removing one of the known stacks is dependency surgery outside
# this file; note cargo-deny skips cannot exempt a deny entry (verified with
# cargo-deny 0.20), so the known stacks are deliberately absent from the deny
# list and documented here instead:
# - ring: the provider reqwest 0.12's rustls-tls, lettre, and
#   vot-transport-tcp select for rustls (cargo tree -i ring).
# - aws-lc-sys: the aws-lc-rs provider object_store (via reqwest 0.13) and
#   rcgen's aws_lc_rs feature select for rustls (cargo tree -i aws-lc-sys).
# - boring-sys: the patched halideworks quiche fork links BoringSSL for QUIC
#   via vot-transport-quiche (cargo tree -i boring-sys).
[bans]
multiple-versions = "warn"

deny = [
    { name = "openssl-sys", reason = "OpenSSL would be a fourth crypto stack; none of our clients link it" },
    { name = "rustls", version = ">0.23", reason = "re-review any rustls that changes provider architecture (e.g. built-in crypto)" },
    { name = "mbedtls-sys", reason = "Mbed TLS would be a fourth crypto stack" },
    { name = "wolfssl", reason = "wolfSSL would be a fourth crypto stack" },
    { name = "wolfssl-sys", reason = "wolfSSL would be a fourth crypto stack" },
    { name = "sodium", reason = "libsodium would be a fourth crypto stack" },
    { name = "libsodium-sys", reason = "libsodium would be a fourth crypto stack" },
    { name = "sodiumoxide", reason = "libsodium would be a fourth crypto stack" },
]

# The duplicate majors below are the KNOWN situation on 2026-09-07 (verified
# with cargo tree -i); they only silence the warn-level duplicate report.
skip = [
    # age's rust-embed-utils and i18n-embed use sha2 0.11; votport and the VOT
    # proof crates use 0.10.
    { name = "sha2", version = "0.11", reason = "age (rust-embed-utils/i18n-embed) and the client core use sha2 0.11" },
    # vot-receipt (VOT fork) signs with hmac 0.13; votport's webhook
    # signatures use 0.12.
    { name = "hmac", version = "0.13", reason = "vot-receipt uses hmac 0.13" },
    # object_store 0.14 and the client core use rand 0.10; the server, age and
    # openidconnect use 0.8. The client tree alone has one rand, so cargo-deny
    # reports these skips as unnecessary there.
    { name = "rand", version = "0.10", reason = "object_store and the client core use rand 0.10" },
    # rand 0.10 (object_store) and getrandom 0.4 (tempfile) use rand_core 0.10;
    # the rest of the tree is on 0.6.
    { name = "rand_core", version = "0.10", reason = "rand 0.10 and getrandom 0.4 use rand_core 0.10" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/halideworks/VOT",
    "https://github.com/halideworks/quiche",
]
