services:
  votport:
    build: .
    container_name: votport
    restart: unless-stopped
    # Only Caddy talks to votport; keep it off the public interface.
    ports:
      - "127.0.0.1:8321:8080"
    environment:
      # REQUIRED: the admin password (or set VOTPORT_ADMIN_PASSWORD_HASH
      # to an argon2 PHC string instead and drop this line).
      VOTPORT_ADMIN_PASSWORD: "change-me-before-first-start"
      # The URL Caddy serves votport at; used for generated links and
      # to mark cookies Secure.
      VOTPORT_PUBLIC_URL: "https://drop.example.com"
      # Optional hard cap per upload session (bytes). Default 50 GiB.
      # VOTPORT_MAX_UPLOAD_BYTES: "53687091200"
      # Optional: allow dot-files in received names (off by default).
      # VOTPORT_ALLOW_HIDDEN: "1"
    volumes:
      # votport state (links, secrets) — keep this private.
      - ./data:/data
      # Where received files land on YOUR machine. Point this wherever
      # you want the files to appear.
      - /srv/votport/received:/received
