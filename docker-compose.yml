services:
  votport:
    build: .
    container_name: votport
    restart: unless-stopped
    # Worst-case queued-body memory for the default session caps: 32
    # sessions x 8 in-flight chunks x ~9 MiB is roughly 2.3 GiB
    # (docs/deployment.md, session limits), on top of the process baseline
    # (SQLite cache and map, ZIP, backup and push buffers). Raise this
    # together with VOTPORT_MAX_TOTAL_SESSIONS; the queued bodies scale
    # linearly with it.
    mem_limit: 4g
    # The runtime's blocking pool alone can grow to 512 threads; 1024 leaves
    # headroom for workers and helpers while bounding a runaway fork.
    pids_limit: 1024
    # Each upload session holds staging and journal descriptors, and the
    # load-test acceptance runs passed at a 1024 soft limit
    # (docs/load-testing.md). 8192 keeps headroom above the tested limit and
    # bounds descriptor leaks.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    # Docker's default 10s SIGKILL cuts off streaming downloads mid-transfer.
    # No value covers a 500 GiB upload; for upgrades, drain first (stop
    # admitting sessions, watch votport_sessions_active reach 0).
    # A stop does not cancel an in-flight storage export either, so keep this
    # above the export time of the largest single file: the SIGKILL at the
    # deadline orphans its unfinished multipart upload.
    stop_grace_period: 5m
    # Bound the json-file log driver: without it the container log grows
    # without limit. Log lines are human-readable by default; set
    # VOTPORT_LOG_FORMAT=json for one JSON object per line, and AUDIT_LOG to
    # a path inside ./data to route audit-target events to a dedicated
    # append-only file instead of stdout.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Received files land in /mediastorage-pool as davidtorcivia:davidtorcivia,
    # matching the other *-in drop folders, instead of root.
    user: "1000:1000"
    # Caddy reaches votport over media-server_default by container name; this
    # published port is host-local only, for debugging.
    ports:
      - "127.0.0.1:8103:8080"
      - "8322:8322/udp"
      - "8323:8323/udp"
    networks:
      - media-server_default
    environment:
      VOTPORT_ADMIN_PASSWORD: "${VOTPORT_ADMIN_PASSWORD:?set VOTPORT_ADMIN_PASSWORD in .env}"
      VOTPORT_PUBLIC_URL: "https://receive.davidtorcivia.com"
      # The reverse proxy (Caddy) connects from the shared compose network,
      # so its X-Forwarded-For is believed; anything else is keyed on its
      # socket address. 172.16.0.0/12 is the Docker user-bridge range; name
      # the proxy's exact address instead if other containers are untrusted
      # (docs/deployment.md, Client addresses).
      VOTPORT_TRUSTED_PROXIES: "${VOTPORT_TRUSTED_PROXIES:-172.16.0.0/12}"
      # 500 GiB per upload session.
      VOTPORT_MAX_UPLOAD_BYTES: "536870912000"
      VOTPORT_ALLOW_HIDDEN: "1"
      # 48 hours. This is the resume window: an interrupted transfer keeps its
      # partially written staging file, and the sender can come back and pick
      # up where they stopped, until the session has been idle this long.
      # 4h proved too short: a sender who stalls overnight loses the partial.
      VOTPORT_SESSION_IDLE_SECS: "172800"
      # Set in .env. Without a metrics token /metrics is served
      # unauthenticated (docs/deployment.md).
      VOTPORT_METRICS_TOKEN: "${VOTPORT_METRICS_TOKEN:-}"
      # Native push and deliver-over-QUIC listen only when their bind is set
      # (docs/native-push.md, docs/deliver-over-quic.md); the UDP ports
      # below must match the binds.
      VOTPORT_PUSH_BIND: "${VOTPORT_PUSH_BIND:-}"
      VOTPORT_PUSH_ADVERTISE: "${VOTPORT_PUSH_ADVERTISE:-}"
      VOTPORT_SERVE_BIND: "${VOTPORT_SERVE_BIND:-}"
      VOTPORT_SERVE_ADVERTISE: "${VOTPORT_SERVE_ADVERTISE:-}"
    volumes:
      # votport state (links, secrets) — keep this private.
      - ./data:/data
      - /mediastorage-pool/vot-in:/received
      - /mediastorage-pool/vot-out:/outbound

networks:
  media-server_default:
    external: true
